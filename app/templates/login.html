{% extends "base.html" %}{% block body %}<div class="login card"><h1>نوف<span style="color:var(--gold)">.</span></h1>
<p class="muted">مركز قيادة الشركة عبر واتساب</p>{% if error %}<p style="color:var(--bad)">{{error}}</p>{% endif %}
<form method="post" action="/dashboard/login"><input type="hidden" name="csrf" value="{{csrf}}">
<label>اسم المستخدم</label><input name="username" required autocomplete="username">
<label>كلمة المرور</label><input name="password" type="password" required autocomplete="current-password">
<p><button class="gold" style="width:100%">دخول</button></p></form></div>{% endblock %}
